name: kr-collect

on:
  workflow_dispatch:        # 수동 실행 (TIGER 200 IT 단기저점 연구용)
  push:
    branches: ['ccr-16814a64-bid0sc', 'claude/**']
    paths: ['sessions/20261016_tiger200it_bottom/collect_kr.py', 'sessions/20261016_tiger200it_bottom/RUN_TRIGGER', '.github/workflows/kr-collect.yml']

permissions:
  contents: write

concurrency:
  group: kr-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r sessions/20261016_tiger200it_bottom/requirements.txt

      - name: 한국 데이터 수집
        run: python sessions/20261016_tiger200it_bottom/collect_kr.py

      - name: 로그 확인
        run: cat sessions/20261016_tiger200it_bottom/data/collect_log.json

      - name: 커밋
        run: |
          git config user.name  "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add -A sessions/20261016_tiger200it_bottom/data
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "session(tiger200it): KR data collect $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin HEAD:"${{ github.ref_name }}" && exit 0
            sleep 3
          done
          exit 1
