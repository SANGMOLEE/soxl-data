name: crypto-once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_crypto_once.py
      - run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/crypto
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "data(crypto): BTC/SOL/BITU/SOLT/IBIT one-off fetch"
          git push origin HEAD:${GITHUB_REF_NAME}
