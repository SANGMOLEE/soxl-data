name: bottom-extra
# 비트코인 저점 해부 연구용 추가 자료 일회성 수집 (시간봉·공포탐욕·펀딩비·온체인 추가 지표).
# 연구 세션 컨테이너는 거래소 주소로 나갈 수 없어 이 작업으로 받는다. 예약 실행 없음.
on:
  workflow_dispatch:
  push:
    branches: [ccr-d4b3886b-gvci67]
    paths:
      - scripts/fetch_bottom_extra.py
      - .github/workflows/bottom-extra.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_crypto_once.py || echo "daily refresh failed, keep old files"
      - run: python scripts/fetch_onchain.py || echo "onchain refresh failed, keep old file"
      - run: python scripts/fetch_bottom_extra.py
      - run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/crypto
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "data(crypto): bottom-anatomy extra fetch"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
