name: sol-study
# 비트코인·솔라나 저점 간격과 상승 시작 시점 연구용 자료 수집. 예약 실행 없음.
on:
  workflow_dispatch:
  push:
    branches: [ccr-d4b3886b-gvci67]
    paths:
      - scripts/fetch_sol_study.py
      - .github/workflows/sol-study.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_crypto_once.py || echo "daily refresh failed"
      - run: python scripts/fetch_onchain.py || echo "onchain refresh failed"
      - run: python scripts/fetch_bottom_extra.py bitstamp_1d fng dvol
      - run: python scripts/fetch_sol_study.py
      - run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/crypto
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "data(crypto): sol study fetch"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
