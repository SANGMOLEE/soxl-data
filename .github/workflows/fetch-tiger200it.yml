name: fetch-tiger200it (연구용 1회성)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/oneoff/fetch_tiger200it.py
      - name: 커밋
        run: |
          git config user.name  "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/manual/TIGER200IT.csv
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "data: TIGER 200 IT (139260) 일봉 이력 추가 (연구용)"
          git push origin HEAD:${GITHUB_REF_NAME}
