name: bottom-refresh
# 가벼운 갱신: 일봉(진행 중 봉 확정), 온체인, 2차 자료 가운데 남은 항목. 예약 실행 없음.
on:
  workflow_dispatch:
  push:
    branches: [ccr-d4b3886b-gvci67]
    paths:
      - scripts/fetch_crypto_once.py
      - scripts/fetch_bottom_extra2.py
      - .github/workflows/bottom-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_crypto_once.py || echo "daily refresh failed, keep old files"
      - run: python scripts/fetch_onchain.py || echo "onchain refresh failed, keep old file"
      - run: python scripts/fetch_bottom_extra.py bitstamp_1d fng dvol coinmetrics
      - run: python scripts/fetch_bottom_extra2.py upbit polymarket fred bgeometrics
      - run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/crypto
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "data(crypto): light refresh"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
