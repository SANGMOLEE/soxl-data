name: daily-collect

on:
  schedule:
    # 22:30 UTC = 미국 정규장 마감 후 (한국시간 익일 07:30)
    # 월~금 실행. 금요일분까지 커버.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: true    # 새로 누르면 낡은 회차를 즉시 취소한다

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 원격과 비교하려면 전체 이력이 필요

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 버전 확인
        run: |
          echo "=============================="
          echo "  workflow v1.5"
          echo "  commit : ${GITHUB_SHA}"
          echo "=============================="

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 원격 최신화
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: 데이터 수집
        run: python scripts/collect.py

      - name: 상태 확인
        run: |
          echo "----- data/status.json -----"
          cat data/status.json

      - name: 커밋
        run: |
          git config user.name  "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add -A data logs
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          ST=$(python -c "import json;print(json.load(open('data/status.json'))['status'])")
          LS=$(python -c "import json;print(json.load(open('data/status.json'))['last_us_session'])")
          git commit -m "data: ${LS} [${ST}]"

          # 원격이 앞서 있으면 rebase(=충돌) 대신
          # 브랜치 포인터만 원격 끝으로 옮기고 우리 결과를 그 위에 얹는다.
          # 수집 결과는 기존 내용을 모두 포함한 상위집합이므로 안전하다.
          for i in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 ${i})"
              exit 0
            fi
            echo "push 거부됨 — 원격 끝으로 재정렬 후 재시도 (${i}/3)"
            git fetch origin main
            git reset --soft origin/main
            git add -A data logs
            if git diff --staged --quiet; then
              echo "원격이 이미 동일한 내용 — 종료"
              exit 0
            fi
            git commit -m "data: ${LS} [${ST}] (재시도 ${i})"
            sleep 3
          done
          echo "::error::push 3회 실패"
          exit 1

      - name: 실패 시 경고
        run: |
          ST=$(python -c "import json;print(json.load(open('data/status.json'))['status'])")
          if [ "$ST" = "FAILED" ]; then
            echo "::warning::수집 실패 항목 있음 — data/status.json 의 failed 배열 확인"
          fi
