name: daily-collect

on:
  schedule:
    # 22:30 UTC = 미국 정규장 마감 후 (한국시간 익일 07:30)
    # 월~금 실행. 금요일분까지 커버.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집
        run: python scripts/collect.py

      - name: 상태 확인
        run: |
          echo "----- data/status.json -----"
          cat data/status.json

      - name: 커밋
        run: |
          git config user.name  "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add -A data logs
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            ST=$(python -c "import json;print(json.load(open('data/status.json'))['status'])")
            LS=$(python -c "import json;print(json.load(open('data/status.json'))['last_us_session'])")
            git commit -m "data: ${LS} [${ST}]"
            git push
          fi

      - name: 실패 시 경고
        run: |
          ST=$(python -c "import json;print(json.load(open('data/status.json'))['status'])")
          if [ "$ST" = "FAILED" ]; then
            echo "::warning::수집 실패 항목 있음 — data/status.json 의 failed 배열 확인"
          fi
