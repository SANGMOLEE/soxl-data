name: daily-collect

on:
  schedule:
    # 22:30 UTC = 미국 정규장 마감 후 (한국시간 익일 07:30)
    # 월~금 실행. 금요일분까지 커버.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # rebase 하려면 전체 이력이 필요

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집
        run: python scripts/collect.py

      - name: 상태 확인
        run: |
          echo "----- data/status.json -----"
          cat data/status.json

      - name: 커밋
        run: |
          git config user.name  "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add -A data logs
          if git diff --staged --quiet; then
            echo "변경 없음"
            exit 0
          fi
          ST=$(python -c "import json;print(json.load(open('data/status.json'))['status'])")
          LS=$(python -c "import json;print(json.load(open('data/status.json'))['last_us_session'])")
          git commit -m "data: ${LS} [${ST}]"

          # 작업 중 원격이 앞서갈 수 있다(수동 업로드 등).
          # rebase 로 원격 변경을 아래에 깔고 재시도. 최대 3회.
          for i in 1 2 3; do
            if git push; then
              echo "push 성공 (시도 ${i})"
              exit 0
            fi
            echo "push 거부됨 — 원격 변경 반영 후 재시도 (${i}/3)"
            git pull --rebase --autostash origin main || {
              echo "::error::rebase 실패 — 수동 확인 필요"
              exit 1
            }
            sleep 5
          done
          echo "::error::push 3회 실패"
          exit 1

      - name: 실패 시 경고
        run: |
          ST=$(python -c "import json;print(json.load(open('data/status.json'))['status'])")
          if [ "$ST" = "FAILED" ]; then
            echo "::warning::수집 실패 항목 있음 — data/status.json 의 failed 배열 확인"
          fi
